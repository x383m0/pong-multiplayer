<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tetris Online — up to 4 players</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="muteBtn" class="mute-btn">🔊 Music</button>
  <h1>Tetris Online — up to 4 players</h1>

  <div id="menu">
    <div id="chooseRole">
      <button id="hostBtn">Host Game</button>
      <div id="joinBox">
        <input id="hostIdInput" placeholder="Enter host's code" />
        <button id="joinBtn">Join Game</button>
      </div>
    </div>

    <div id="lobby" style="display:none;">
      <p id="status"></p>
      <ul id="lobbyList"></ul>
      <button id="startBtn" style="display:none;">Start Game</button>
    </div>
  </div>

  <div id="gameArea" style="display:none;">
    <div class="panel side">
      <h3>Hold</h3>
      <canvas id="holdPiece" width="96" height="96"></canvas>
      <h3 style="margin-top:12px;">Garbage</h3>
      <div class="garbage-meter-container">
        <div id="garbageMeter" class="garbage-meter"></div>
      </div>
    </div>

    <div class="panel">
      <h2>You</h2>
      <canvas id="myBoard" width="240" height="480"></canvas>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Lines: <span id="lines">0</span></div>
      </div>
    </div>

    <div class="panel side">
      <h3>Next</h3>
      <canvas id="nextPiece" width="96" height="288"></canvas>
      <h3 style="margin-top:12px;">Opponents</h3>
      <div id="oppBoards"></div>
    </div>
  </div>

  <p id="resultMsg" class="result"></p>
  <p class="controls">Controls: ← → move · ↑ rotate · ↓ soft drop · Space hard drop · C hold</p>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
