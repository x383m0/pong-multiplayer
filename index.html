<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1v1 Tetris Online</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>1v1 Tetris — Online</h1>

  <div id="menu">
    <button id="hostBtn">Host Game</button>
    <div id="joinBox">
      <input id="hostIdInput" placeholder="Enter host's code" />
      <button id="joinBtn">Join Game</button>
    </div>
    <p id="status"></p>
  </div>

  <div id="gameArea" style="display:none;">
    <div class="panel">
      <h2>You</h2>
      <canvas id="myBoard" width="240" height="480"></canvas>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Lines: <span id="lines">0</span></div>
      </div>
    </div>

    <div class="panel side">
      <div>
        <h3>Next</h3>
        <canvas id="nextPiece" width="96" height="96"></canvas>
      </div>
      <div>
        <h3>Opponent</h3>
        <canvas id="oppBoard" width="120" height="240"></canvas>
      </div>
    </div>
  </div>

  <p id="resultMsg" class="result"></p>
  <p class="controls">Controls: ← → move · ↑ rotate · ↓ soft drop · Space hard drop</p>

  <!-- PeerJS: handles WebRTC connection setup, no backend needed -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
